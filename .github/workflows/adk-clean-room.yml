# ADK clean room. Packs the public packages and runs the installed CLI
# outside this checkout. It signs with a generated key and does not deploy.
# The air-gap step installs file: tarballs and refuses the npm registry.
# Docker is not used.

name: ADK clean room

on:
  pull_request:
    paths:
      - 'tools/adk/**'
      - 'templates/kassis-addon/**'
      - 'packages/addon-cli/**'
      - 'packages/addon-sdk/**'
      - 'packages/addon-testkit/**'
      - 'packages/host-sdk/**'
      - 'packages/addon-ui/**'
      - 'packages/agent-kit/**'
      - 'packages/adk-core/**'
      - 'server/core/addon-deployment/**'
      - 'server/core/addon-platform/**'
      - 'docs/developer/technical/adk/**'
      - 'scripts/adk-clean-room.mjs'
      - '.github/workflows/adk-clean-room.yml'
  # Weekly catches registry drift; pull requests that touch the ADK run it as well.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: adk-clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adk-clean-room:
    name: ADK clean room
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && !startsWith(github.head_ref, 'dependabot/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","kassis-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Kassis Node
        uses: ./.github/actions/setup-kassis-node

      - name: Pack, install, and exercise the CLI
        run: node scripts/adk-clean-room.mjs --write-bundle=airgap-bundle

      - name: Install and build from the air-gap bundle
        run: node scripts/adk-clean-room.mjs --airgap --bundle=airgap-bundle
