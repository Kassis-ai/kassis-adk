# S2.43 reference build. Packs the public ADK packages and certifies
# __tests__/fixtures/acme-swift-approval twice outside the checkout.
# Dispatch only: a push on this branch must not fail because the lab is down.
# The job does not deploy and does not register the acme publisher key.

name: ADK reference build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-build:
    name: Certify acme-swift-approval twice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/adk-reference-build.mjs
